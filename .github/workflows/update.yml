name: Update job tracker

on:
  schedule:
    # Monday and Thursday at 12:00 UTC = 8am Eastern Daylight Time, 7am once
    # clocks change in November. GitHub cron is always UTC, so the local time
    # shifts by an hour twice a year. Roughly every 3 to 4 days.
    #   every 3 days instead:  "0 12 */3 * *"
    #   daily:                 "0 12 * * *"
    #   back to every 6 hours: "0 */6 * * *"
    - cron: "0 12 * * 1,4"
  workflow_dispatch:        # lets you run it manually from the Actions tab

# Prevent overlapping runs from writing to the sheet at the same time.
concurrency:
  group: job-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python main.py
