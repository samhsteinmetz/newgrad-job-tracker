    # More US metros. Two letter codes for these states are deliberately NOT
    # listed: "in", "or", "me", "hi", "de", "la" and "ok" are ordinary English
    # words and would match foreign strings like "Remote in UK".
    - "indianapolis"
    - "columbus"
