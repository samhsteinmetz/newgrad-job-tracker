# ============================================================================
# Job tracker configuration
# Everything the pipeline pulls from lives here. Edit this file, not the code.
# ============================================================================

# --- Google Sheet -----------------------------------------------------------
sheet:
  # The tab (worksheet) name inside your spreadsheet that jobs get written to.
  worksheet: "Jobs"

# --- Filters (applied to every source) --------------------------------------
filters:
  # A title must look like a new grad / entry level full time role.
  # Matched case insensitively as a whole word or phrase.
  include_title_any:
    - "new grad"
    - "new graduate"
    - "entry level"
    - "entry-level"
    - "university grad"
    - "college grad"
    - "campus"
    - "early career"
    - "associate software engineer"
    - "software engineer i"
    - "software engineer 1"
    - "graduate software"
    - "graduate engineer"
    - "rotational"
    - "development program"
    - "leadership program"
    - "technology analyst"
    - "technology consultant"
    - "2026 grad"
    - "2027 grad"
    - "class of 2026"
    - "class of 2027"

  # If a title contains any of these it is dropped, no matter what.
  # This kills internships and anything too senior.
  exclude_title_any:
    - "intern"
    - "internship"
    - "co-op"
    - "coop"
    - "senior"
    - "staff"
    - "principal"
    - "lead "
    - "manager"
    - "director"
    - "vp "
    - "head of"
    - "phd"

  # Dropped when matched as a whole word (so a level "II" or "2" is excluded,
  # but a year like "2027" or a word like "Hawaii" is left alone).
  exclude_title_regex:
    - "\\b(ii|iii|iv)\\b"
    - "\\b(2|3|4)\\b"

  # Drop anything posted before this date. The community feeds keep
  # prior-cycle roles marked active, so without a floor the sheet fills with
  # 2025 (and older) listings that are long closed. You graduate Dec 2026, so
  # the relevant wave starts around Aug 2026. Postings with no usable date are
  # kept rather than dropped.
  min_date_posted: "2026-06-01"

  # Only keep roles that look US based. Location text is matched against these.
  # A bare "Remote" is treated as US, see non_us_location_any below.
  # Set us_only to false to keep everything regardless of location.
  us_only: true
  us_location_hints:
    - "united states"
    - "usa"
    - "u.s."
    - "new york"
    - "san francisco"
    - "seattle"
    - "austin"
    - "boston"
    - "chicago"
    - "atlanta"
    - "los angeles"
    - "denver"
    - "dallas"
    - "washington"
    - "mclean"
    - "virginia"
    - "california"
    - "texas"
    - "ca"
    - "ny"
    - "wa"
    - "tx"
    - "ma"
