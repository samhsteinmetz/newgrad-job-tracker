# --- Source 1: community GitHub feeds (the highest signal, already deduped) --
# These publish a listings.json that many people maintain. Free, no key.
github_feeds:
  - name: "Simplify New-Grad"
    url: "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json"
  - name: "vanshb03 New-Grad-2027"
    url: "https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json"

# --- Source 2: company ATS boards (free public JSON, no key) -----------------
# Add any company you care about. Find the token from the company careers URL:
#   Greenhouse: boards.greenhouse.io/COMPANY  ->  token is COMPANY
#   Lever:      jobs.lever.co/COMPANY         ->  site   is COMPANY
# The samples below are common new grad heavy employers. Verify each token,
# some rotate. A bad token just gets skipped, it will not break the run.
# Verified working as of 2026-09-10.
greenhouse_boards:
  - stripe
  - databricks
  - robinhood
  - coinbase
  - discord
  - flexport
  - samsara
  - gusto
  - brex          # moved here from Lever
  - attentive     # moved here from Lever
  - figma
  - airbnb
  - instacart
  - reddit
  - scaleai
  - anthropic

lever_boards:
  - palantir
  - spotify

# Removed because their boards now 404 on both APIs. Ramp, Notion, OpenAI,
# Anduril, Plaid, DoorDash and Netflix have moved to Ashby or an in-house
# board. Adding an Ashby fetcher would bring them back:
#   https://api.ashbyhq.com/posting-api/job-board/{token}

# --- Source 3: Adzuna keyword API (free key, best for consulting + rotational)
# This is how you catch Deloitte, Accenture, EY, PwC, KPMG, Capital One TDP and
# other big employers that do not expose a clean board API. Get a free
# app_id + app_key at https://developer.adzuna.com/ and add them as GitHub
# secrets ADZUNA_APP_ID and ADZUNA_APP_KEY. Leave secrets empty to skip Adzuna.
adzuna:
  country: "us"
  max_days_old: 7          # only postings from the last N days, keeps it fresh
  results_per_page: 50
  pages_per_query: 2       # 50 * 2 = up to 100 results per query
  queries:
    - "software engineer new grad"
    - "new grad software engineer"
    - "entry level software engineer"
    - "software engineer university graduate"
    - "technology analyst program"
    - "technology development program"
    - "rotational program software"
    - "technology consulting analyst new grad"
    - "associate software engineer"
